<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《星渊神域》- 次世代奇幻MMORPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            /* 游戏暗黑奇幻主题配色 */
            --primary: #6200ea;     /* 深紫 */
            --secondary: #0a0a0f;   /* 极暗背景 */
            --accent: #00e5ff;      /* 霓虹青色(高亮) */
            --light-bg: #161621;    /* 卡片背景 */
            --text-main: #f0f0f5;   /* 主文字 */
            --text-muted: #9ba1b0;  /* 次要文字 */
            --glow: 0 0 15px rgba(0, 229, 255, 0.6); /* 发光特效 */
        }

        body {
            background-color: var(--secondary);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 顶部导航：毛玻璃效果 */
        header {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
        }
